name: SEO and publishing checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, fileinfo
          coverage: none
          tools: none
      - name: Check PHP and SEO behavior
        run: |
          find hosting -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          php tests/seo.php
          php tests/blog.php
          python3 -m unittest discover -s tests -p 'test_seo.py' -v
